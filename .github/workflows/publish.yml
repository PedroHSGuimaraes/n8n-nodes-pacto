name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  # Deixa o dono republicar (e aprovar de novo) sem mover a tag.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish with provenance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # O token NPM_TOKEN é granular "Read and write (stage only)" (decisão do dono, 06/11/2026):
      # com ele `npm publish` e `npm run release` falham com E_STAGE_REQUIRED. A versão vai para a fila
      # de espera e o dono a aprova com 2FA na aba Staged Packages do npmjs.com.
      # `npm stage` só existe no npm 12; o Node LTS do runner traz o npm 11, por isso o npx fixa a versão.
      # `prepublishOnly` roda `n8n-node prerelease`, que encerra com código 1 sem RELEASE_MODE.
      - name: Stage package for approval
        run: npx -y npm@12.2.2 stage publish --provenance --access public
        env:
          RELEASE_MODE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
